<!doctype html><html lang="de"><meta charset="utf-8"><title>W90 f88r Sichtprüfung</title><style>body{font:18px sans-serif;max-width:1200px;margin:auto;padding:20px}svg{width:100%;height:auto}rect{fill:transparent;stroke:#a700ca;stroke-width:3}text{font:bold 30px sans-serif;fill:#a700ca;stroke:white;stroke-width:1;paint-order:stroke}g:hover rect{fill:#ffe60035}</style><h1>f88r: manuelle Vergleichsstellen</h1><p>Unverändertes Quellbild. Rahmen sind ungefähre Orientierung, keine gesicherten Objektgrenzen. Maus über Rahmen: Beobachtung. U=oben, M=Mitte, L=untere beschriftete Reihe, F=ganz unten, V=Gefäßform.</p><svg viewBox="0 0 2000 2752"><image href="f88r.jpg" width="2000" height="2752"/><g><title>U1: Helle lange Wurzelstränge mit braunen Abschnitten; schmale verzweigte obere Formen, teilweise grünlich. — Nähe links; keine Verweislinie</title><rect x="510" y="135" width="250" height="485"/><text x="515" y="165">U1</text></g><g><title>U2: Brauner verdickter gegabelter Unterteil; heller dünner verzweigter Stängel. — Text links vom Stängel; Nähe allein</title><rect x="685" y="130" width="200" height="465"/><text x="690" y="160">U2</text></g><g><title>U3: Kurzer brauner Queransatz; mehrere dünne Wurzelstränge; aufgefächerte obere Striche und grüne Farbfläche. — Text links; Nachbarzeichnung nahe</title><rect x="835" y="145" width="235" height="440"/><text x="840" y="175">U3</text></g><g><title>U4: Zwei braune längliche Lappen um hellen Mittelstreifen; dünne seitliche Fortsätze, obere Stängel. — Text links; keine präzise Teilbindung</title><rect x="1090" y="150" width="195" height="470"/><text x="1095" y="180">U4</text></g><g><title>U5: Heller gezackter Ansatz; lange geschwungene helle Wurzeln; links grüne Fläche, rechts langes grünes Blatt. — Zwei Texte in Nähe von Ansatz und rechtem Blatt; Ganzes/Teil offen</title><rect x="1220" y="135" width="495" height="530"/><text x="1225" y="165">U5</text></g><g><title>M1: Lange verschlungene braun-helle Wurzelzüge; oben rechts gelappte grüne Blattgruppe. — Texte links der Wurzel und nahe Blattgruppe; Ganzes/Teil offen</title><rect x="385" y="875" width="430" height="615"/><text x="390" y="905">M1</text></g><g><title>M2: Kleiner brauner Ansatz mit langen dünnen abwärts gerichteten Strängen und gebogenen oberen Linien. — Text oberhalb; Verbindung zum nahen M3 nicht sicher auszuschließen</title><rect x="655" y="900" width="270" height="435"/><text x="660" y="930">M2</text></g><g><title>M3: Grüner länglicher gerandeter Körper auf hellem gegliedertem Schaft. — Text rechts oben; Objektabgrenzung zu M2 provisorisch</title><rect x="900" y="925" width="95" height="285"/><text x="905" y="955">M3</text></g><g><title>M4: Breiter heller Ansatz mit langen hell-braunen Wurzelzügen; zwei auffällige breite, unterschiedlich gegliederte grüne Blattflächen. — Text unter rechter Blattfläche; Ansatz weiter links</title><rect x="935" y="880" width="425" height="450"/><text x="940" y="910">M4</text></g><g><title>M5: Heller punktierter/lappiger verdickter Unterteil; brauner auslaufender Teil; verzweigter oberer Trieb mit mehreren grünen Blättern. — Text rechts oben am verzweigten Blattbereich</title><rect x="1165" y="880" width="685" height="590"/><text x="1170" y="910">M5</text></g><g><title>L1: Heller offener Ansatz; mehrere lange rötlich-helle Wurzelstränge; längliche gezähnte grüne Blätter. — Zwei Textgruppen links; keine sichere Ganzes/Teil-Zuweisung</title><rect x="480" y="1600" width="595" height="360"/><text x="485" y="1630">L1</text></g><g><title>L2: Dicke seitlich auslaufende gewellte helle Wurzelzüge; links rundliche bis tief gelappte grüne Endformen. — Text oben nahe Wurzelzügen; gesamte Bild/Textgrenze teilweise eng</title><rect x="1090" y="1630" width="785" height="725"/><text x="1095" y="1660">L2</text></g><g><title>F1: Seitlich liegender heller Ansatz; sehr lange bandförmige grüne Blätter links; fächernde helle/rötliche Wurzelstränge rechts. — Kein eigener eindeutig abgegrenzter Beschriftungstext in unmittelbarer Nähe</title><rect x="115" y="2390" width="1750" height="305"/><text x="120" y="2420">F1</text></g><g><title>V1: Rot-grün-helle mehrstufige Form, oben offene grüne Ovalfläche, unten ausladender Fuß. — Benachbarte Texte nicht als Gefäßnamen gebunden</title><rect x="165" y="205" width="255" height="730"/><text x="170" y="235">V1</text></g><g><title>V2: Rot-grün-helle gestufte Form, konischer oberer Aufbau, breiter unterer Auslauf und Fuß. — Benachbarte Texte nicht als Gefäßnamen gebunden</title><rect x="195" y="965" width="230" height="750"/><text x="200" y="995">V2</text></g><g><title>V3: Rot-grün-helle gestufte Form, schmaler hoher Abschluss, runder Sockel. — Benachbarte Texte nicht als Gefäßnamen gebunden</title><rect x="190" y="1720" width="250" height="770"/><text x="195" y="1750">V3</text></g></svg><p><a href="REPORT.md">Bericht</a> · <a href="OBJECTS.tsv">Alle Beobachtungen</a> · <a href="PAIRS.tsv">Vergleichspaare</a></p></html>
